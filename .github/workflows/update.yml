name: update
on: {push: {branches: [main]}, workflow_dispatch:, schedule: [{cron: '*/5 * * * *'}]}
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -L -k -o Whyte_Island.txt "https://opendata.tmr.qld.gov.au/Whyte_Island.txt?nocache=$(date +%s)"
          cat Whyte_Island.txt | tail -20
          git config user.name bot
          git config user.email bot@bot.com
          git add Whyte_Island.txt
          git commit -m "live $(date)" || echo "no changes"
          git push || echo "push failed"
