<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Whyte Island LIVE 2.069m</title>
<style>body{margin:0;font-family:system-ui;background:#e0f2fe}.c{background:#fff;margin:16px;padding:24px;border-radius:16px;border:1px solid #cbd5e1}.t{font-size:96px;font-weight:900;letter-spacing:-3px}</style>
</head><body>
<div class="c"><b>Whyte Island 046046A</b> - <span id="src">Loading Whyte_Island.txt...</span> <span id="clock" style="float:right"></span></div>
<div class="c"><div style="opacity:.6;font-size:12px">TIDE HEIGHT m LAT - LIVE FROM GITHUB ACTION</div><div class="t" id="tide">Loading...</div><div id="obs" style="font-size:20px;font-weight:700;margin-top:12px"></div><div id="head" style="opacity:.7"></div><div id="fet" style="opacity:.7"></div></div>
<script>
setInterval(()=>clock.textContent=new Date().toLocaleString('en-AU',{timeZone:'Australia/Brisbane'}),1000);
async function load(){
  try{
    const r=await fetch('./Whyte_Island.txt?t='+Date.now(),{cache:'no-store'});
    const txt=await r.text();
    const re=/(\d{12})\s+([0-9.]+)/g; let m,pts=[];
    while((m=re.exec(txt))!==null){pts.push({ts:m[1],h:parseFloat(m[2]),raw:m[0]})}
    pts.sort((a,b)=>a.ts.localeCompare(b.ts));
    const last=pts[pts.length-1];
    const hd=txt.match(/Data_last_updated\s+([^\n]+)/i);
    document.getElementById('tide').textContent=last.h.toFixed(3)+'m';
    document.getElementById('obs').textContent=`Observation: ${last.ts.substr(0,2)}/${last.ts.substr(2,2)}/${last.ts.substr(4,4)} ${last.ts.substr(8,2)}:${last.ts.substr(10,2)} AEST = ${last.raw}`;
    document.getElementById('head').textContent='File: '+(hd?hd[1]:'--')+' • '+pts.length+' points';
    document.getElementById('fet').textContent='Fetched: '+new Date().toLocaleString('en-AU',{timeZone:'Australia/Brisbane'});
    document.getElementById('src').textContent='Source:./Whyte_Island.txt LIVE • Latest key '+last.ts+' (should be 141020261017 or newer)';
  }catch(e){
    document.getElementById('src').textContent='Fetch failed: '+e.message+' - ensure Whyte_Island.txt exists in repo root';
  }
}
load(); setInterval(load,60000);
</script></body></html>
